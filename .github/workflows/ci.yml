name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aprag-lab-ci:
    name: aprag-lab-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APRAG_PROVIDER_MODE: deterministic
      APRAG_QUEUE_MODE: inline
      APRAG_VECTOR_STORE: sqlite
      APRAG_MEDIA_RUNTIME: container
      DATA_DIR: /tmp/APRAG-Lab-ci-data
      WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install API dependencies
        working-directory: apps/api
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run API tests
        working-directory: apps/api
        run: pytest -q

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run web tests
        working-directory: apps/web
        run: npm test -- --run

      - name: Build web
        working-directory: apps/web
        run: npm run build

      - name: Validate desktop wrapper
        run: node --check apps/desktop/main.js
