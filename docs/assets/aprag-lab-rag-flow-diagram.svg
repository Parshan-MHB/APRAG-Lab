<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">APRAG-Lab multimodal RAG benchmark flow</title>
  <desc id="desc">Diagram showing multimodal inputs flowing through extraction, indexing, three RAG strategies, comparison, and observability.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.48" stop-color="#EEF6F3"/>
      <stop offset="1" stop-color="#F7F3EA"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L12 7L2 12" stroke="#334155" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 800 38px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .subtitle { font: 500 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .label { font: 800 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .body { font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 700 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748B; letter-spacing: .6px; }
      .dark-small { font: 700 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #CBD5E1; letter-spacing: .6px; }
      .dark-body { font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #E2E8F0; }
      .pill { font: 800 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .line { stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .soft-line { stroke: #CBD5E1; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1280" height="720" rx="36" fill="url(#page)"/>
  <rect x="34" y="34" width="1212" height="652" rx="28" fill="#FFFFFF" stroke="#E2E8F0"/>

  <text x="74" y="88" class="title">APRAG-Lab</text>
  <text x="74" y="119" class="subtitle">Local-first multimodal RAG benchmarking with real models, citations, traces, queues, and dashboards.</text>

  <g transform="translate(74 156)" filter="url(#shadow)">
    <rect width="186" height="370" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="22" y="38" class="small">INPUTS</text>
    <text x="22" y="73" class="label">Multimodal sources</text>
    <rect x="22" y="98" width="142" height="38" rx="10" fill="#ECFEFF" stroke="#67E8F9"/>
    <text x="40" y="122" class="pill">PDF / DOCX</text>
    <rect x="22" y="148" width="142" height="38" rx="10" fill="#F0FDF4" stroke="#86EFAC"/>
    <text x="40" y="172" class="pill">CSV / JSON</text>
    <rect x="22" y="198" width="142" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D"/>
    <text x="40" y="222" class="pill">Images</text>
    <rect x="22" y="248" width="142" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4"/>
    <text x="40" y="272" class="pill">Audio</text>
    <rect x="22" y="298" width="142" height="38" rx="10" fill="#EEF2FF" stroke="#A5B4FC"/>
    <text x="40" y="322" class="pill">Video</text>
  </g>

  <g transform="translate(307 156)" filter="url(#shadow)">
    <rect width="198" height="370" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="22" y="38" class="small">INGESTION</text>
    <text x="22" y="73" class="label">Extract evidence</text>
    <text x="22" y="106" class="body">Text and tables</text>
    <text x="22" y="135" class="body">OCR regions</text>
    <text x="22" y="164" class="body">Audio transcripts</text>
    <text x="22" y="193" class="body">Video frames</text>
    <text x="22" y="222" class="body">Source metadata</text>
    <line x1="22" y1="252" x2="176" y2="252" class="soft-line"/>
    <text x="22" y="285" class="small">HOST RUNTIME</text>
    <text x="22" y="315" class="body">FFmpeg</text>
    <text x="22" y="342" class="body">Tesseract</text>
    <text x="112" y="342" class="body">Whisper</text>
  </g>

  <g transform="translate(552 156)" filter="url(#shadow)">
    <rect width="202" height="370" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="22" y="38" class="small">KNOWLEDGE BASE</text>
    <text x="22" y="73" class="label">Index and graph</text>
    <rect x="22" y="102" width="158" height="54" rx="13" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="42" y="134" class="pill">Chunks + citations</text>
    <rect x="22" y="177" width="158" height="54" rx="13" fill="#F0FDF4" stroke="#86EFAC"/>
    <text x="42" y="209" class="pill">bge-m3 embeddings</text>
    <rect x="22" y="252" width="158" height="54" rx="13" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="42" y="284" class="pill">Graph signals</text>
    <text x="22" y="337" class="body">SQLite + Chroma/Qdrant</text>
  </g>

  <g transform="translate(804 138)" filter="url(#shadow)">
    <rect width="210" height="414" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="22" y="38" class="small">RAG FLOWS</text>
    <text x="22" y="73" class="label">Same question</text>
    <rect x="22" y="104" width="166" height="70" rx="14" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="42" y="133" class="pill">Traditional RAG</text>
    <text x="42" y="154" class="body">retrieve, answer</text>
    <rect x="22" y="197" width="166" height="70" rx="14" fill="#F5F3FF" stroke="#C4B5FD"/>
    <text x="42" y="226" class="pill">Agentic RAG</text>
    <text x="42" y="247" class="body">plan, verify, cite</text>
    <rect x="22" y="290" width="166" height="70" rx="14" fill="#ECFDF5" stroke="#6EE7B7"/>
    <text x="42" y="319" class="pill">Hybrid Graph RAG</text>
    <text x="42" y="340" class="body">fusion + graph</text>
  </g>

  <g transform="translate(1060 156)" filter="url(#shadow)">
    <rect width="146" height="370" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="20" y="38" class="small">OUTPUTS</text>
    <text x="20" y="73" class="label">Compare</text>
    <text x="20" y="111" class="body">Answers</text>
    <text x="20" y="140" class="body">Citations</text>
    <text x="20" y="169" class="body">Grounding</text>
    <text x="20" y="198" class="body">Latency</text>
    <text x="20" y="227" class="body">Metrics</text>
    <text x="20" y="256" class="body">Trace steps</text>
    <text x="20" y="285" class="body">Exports</text>
    <line x1="20" y1="313" x2="126" y2="313" class="soft-line"/>
    <text x="20" y="343" class="body">Jaeger</text>
    <text x="78" y="343" class="body">Phoenix</text>
  </g>

  <line x1="264" y1="341" x2="300" y2="341" class="line"/>
  <line x1="510" y1="341" x2="545" y2="341" class="line"/>
  <line x1="760" y1="341" x2="797" y2="341" class="line"/>
  <line x1="1020" y1="341" x2="1053" y2="341" class="line"/>

  <g transform="translate(74 572)">
    <rect width="1132" height="72" rx="18" fill="#0F172A"/>
    <text x="28" y="31" class="dark-small">MODEL AND INFRASTRUCTURE LAYER</text>
    <text x="28" y="55" class="dark-body">Host Ollama runs qwen3, qwen3-vl, and bge-m3. Docker runs FastAPI, React, Redis, workers, SQLite metadata, Chroma/Qdrant, Jaeger, and Phoenix.</text>
  </g>
</svg>
