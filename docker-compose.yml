services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/app/data
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - APRAG_MEDIA_RUNTIME=host
      - APRAG_HOST_MEDIA_BASE_URL=http://host.docker.internal:8765
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - QDRANT_URL=http://qdrant:6333
      - APRAG_PROVIDER_MODE=real
      - APRAG_MODEL_PROFILE=auto
      - APRAG_QUEUE_MODE=local
      - APRAG_VECTOR_STORE=chroma
      - APRAG_OLLAMA_NUM_PREDICT=512
      - APRAG_VLM_NUM_PREDICT=256
      - APRAG_OBSERVABILITY_ENABLED=true
      - APRAG_OTEL_EXPORTER_OTLP_ENDPOINTS=http://jaeger:4318/v1/traces,http://phoenix:6006/v1/traces
      - OTEL_SERVICE_NAME=aprag-lab-api
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-APRAG-Lab}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
      - WORKSPACE_ROOT=/workspace
    volumes:
      - ./apps/api:/app
      - ./data:/app/data
      - ./:/workspace:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./apps/api
    environment:
      - DATA_DIR=/app/data
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - APRAG_MEDIA_RUNTIME=host
      - APRAG_HOST_MEDIA_BASE_URL=http://host.docker.internal:8765
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - QDRANT_URL=http://qdrant:6333
      - APRAG_PROVIDER_MODE=real
      - APRAG_MODEL_PROFILE=auto
      - APRAG_QUEUE_MODE=local
      - APRAG_VECTOR_STORE=chroma
      - APRAG_OLLAMA_NUM_PREDICT=512
      - APRAG_VLM_NUM_PREDICT=256
      - APRAG_OBSERVABILITY_ENABLED=true
      - APRAG_OTEL_EXPORTER_OTLP_ENDPOINTS=http://jaeger:4318/v1/traces,http://phoenix:6006/v1/traces
      - OTEL_SERVICE_NAME=aprag-lab-worker
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-APRAG-Lab}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
      - WORKSPACE_ROOT=/workspace
    volumes:
      - ./apps/api:/app
      - ./data:/app/data
      - ./:/workspace:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python -m app.worker local
    depends_on:
      redis:
        condition: service_healthy

  rq-worker:
    build:
      context: ./apps/api
    profiles: ["queue"]
    environment:
      - DATA_DIR=/app/data
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - APRAG_MEDIA_RUNTIME=host
      - APRAG_HOST_MEDIA_BASE_URL=http://host.docker.internal:8765
      - APRAG_OBSERVABILITY_ENABLED=true
      - APRAG_OTEL_EXPORTER_OTLP_ENDPOINTS=http://jaeger:4318/v1/traces,http://phoenix:6006/v1/traces
      - OTEL_SERVICE_NAME=aprag-lab-rq-worker
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-APRAG-Lab}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/api:/app
      - ./data:/app/data
    command: rq worker APRAG-Lab --url redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./apps/api
    profiles: ["queue"]
    environment:
      - DATA_DIR=/app/data
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - APRAG_MEDIA_RUNTIME=host
      - APRAG_HOST_MEDIA_BASE_URL=http://host.docker.internal:8765
      - APRAG_OBSERVABILITY_ENABLED=true
      - APRAG_OTEL_EXPORTER_OTLP_ENDPOINTS=http://jaeger:4318/v1/traces,http://phoenix:6006/v1/traces
      - OTEL_SERVICE_NAME=aprag-lab-celery-worker
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-APRAG-Lab}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/api:/app
      - ./data:/app/data
    command: celery -A app.worker.celery_app worker --loglevel=INFO
    depends_on:
      redis:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["vector"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant:/qdrant/storage

  chroma:
    image: chromadb/chroma:0.6.3
    profiles: ["vector"]
    ports:
      - "8001:8000"
    volumes:
      - chroma:/chroma/chroma

  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8083:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      redis:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
      - "4317:4317"
    volumes:
      - phoenix:/mnt/data

  web:
    build:
      context: ./apps/web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant:
  chroma:
  phoenix:
